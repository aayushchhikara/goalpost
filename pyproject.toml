[project]
name = "goalpost-workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["goalpost"]

[tool.uv]
package = false

[tool.uv.workspace]
# Connectors join the workspace as each gets a pyproject.toml (e.g. "connectors/github").
members = ["backend"]

[tool.uv.sources]
goalpost = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "pyright>=1.1.380", "pre-commit>=3.8"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["backend"]
exclude = ["backend/migrations"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"
