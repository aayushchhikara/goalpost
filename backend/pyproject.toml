[project]
name = "goalpost"
version = "0.0.0"
description = "Goalpost backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "apscheduler>=3.10",
  "cryptography>=43",
  "python-ulid>=3.0",
  "tzdata>=2024.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["goalpost"]

[tool.pytest.ini_options]
testpaths = ["tests"]
